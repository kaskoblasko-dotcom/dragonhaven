<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a9ad9">
<title>Dragon Haven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: bright, cheerful mobile-game housing, chunky and touch-first.
   IDEA: a sky archipelago seen like a toy diorama you can drag around.
   PICTURE: the islands fill the screen; panels slide over them.
   COLOUR and TYPE: sky blue field, grass green, gold accent; Baloo 2 + Nunito.
   LAYOUT: landscape-first: HUD top, dock bottom-right, guide bottom-left. */
:root{--ink:#17324d;--sky1:#5cc2f2;--sky2:#c8efff;--gold:#ffb400;--green:#36b24a;--blue:#2f86de;--red:#e5484d;--panel:#fff;--soft:#eef6fb;--line:#d6e6f1;--fb:"Baloo 2",Nunito,sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky1);color:var(--ink);font:15px/1.4 Nunito,system-ui,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
h1,h2,h3,.btn,.chip b{font-family:var(--fb)}
#app{position:fixed;inset:0;background:linear-gradient(180deg,#4fb8ee,#bfeaff 70%,#e6f7ff)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#world.dragging{cursor:grabbing}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-500px)}to{transform:translateX(3400px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.hover{animation:hov 2s ease-in-out infinite}
@keyframes hov{50%{transform:translateY(-9px)}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.12)}}
.float{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-10px)}}
.heart{animation:rise 2.4s ease-in infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.bld,.plot,.arenaIs{cursor:pointer}
.bld:hover,.plot:hover .lockpatch,.arenaIs:hover{filter:brightness(1.08)}
.ghost{opacity:.8;pointer-events:none}
.faded{opacity:.35}

/* HUD */
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.lvl{display:flex;align-items:center;gap:6px;background:rgba(18,44,70,.82);color:#fff;border-radius:22px;padding:3px 12px 3px 3px;height:40px}
.lvl .badge{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f29b00);display:grid;place-items:center;font:800 16px var(--fb);color:#5a3300;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.xpbar{width:70px;height:8px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#9cf06b,#36b24a)}
.chip{display:flex;align-items:center;gap:6px;background:rgba(18,44,70,.82);color:#fff;border-radius:22px;padding:3px 4px 3px 6px;height:40px}
.chip svg{width:28px;height:28px;flex:none}
.chip b{font-size:17px;min-width:44px;text-align:right;white-space:nowrap}
.chip .plus{width:26px;height:26px;border-radius:50%;background:var(--green);font:800 18px/26px var(--fb);color:#fff;text-align:center}
#hud .sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;background:rgba(18,44,70,.82);display:grid;place-items:center;color:#fff}
.iconbtn svg{width:24px;height:24px}
#saveDot{font-size:12px;color:#fff;background:rgba(18,44,70,.6);padding:4px 10px;border-radius:12px;white-space:nowrap}

/* Docks */
#dock{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:5}
#leftDock{position:absolute;left:calc(10px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:5}
.dk{display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;position:relative}
.dk .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 -4px 0 rgba(0,0,0,.15);border:3px solid #fff}
.dk .ic svg{width:34px;height:34px}
.dk span{font:800 13px var(--fb);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.dk .dot{position:absolute;top:-4px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid #fff}
.hint{animation:hint 1s ease-in-out infinite}
.hint::after{content:"";position:absolute;top:-26px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:14px solid #ffcf3f;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
@keyframes hint{50%{transform:translateY(-5px)}}
.btn.hint{position:relative}

/* Banner */
#banner{position:absolute;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:6px 8px 6px 16px;display:none;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:6;font-weight:800;white-space:nowrap;max-width:96vw}
#banner.on{display:flex}
#banner span{overflow:hidden;text-overflow:ellipsis}

/* Guide */
#guide{position:absolute;left:calc(10px + env(safe-area-inset-left));bottom:calc(90px + env(safe-area-inset-bottom));z-index:7;display:none;align-items:flex-end;gap:6px;max-width:min(470px,70vw)}
#guide.on{display:flex}
#guide .owl{width:86px;height:96px;flex:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
#guide .say{background:#fff;border-radius:18px 18px 18px 4px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:700}
#guide .say b{font-family:var(--fb);display:block;color:#9a5b00;font-size:15px}
#guide .say .row{margin-top:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 16px;border-radius:14px;font-weight:800;font-size:16px;color:#fff;background:var(--green);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.btn.blue{background:var(--blue)}.btn.gold{background:var(--gold);color:#4a2a00}.btn.red{background:var(--red)}.btn.grey{background:#9fb2c3}.btn.gem{background:#13b6c9}
.btn[disabled]{background:#c4d0da;color:#fff;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:36px;font-size:14px;padding:4px 12px;border-radius:12px}
.btn svg{width:20px;height:20px}
:focus-visible{outline:3px solid #ffcf3f;outline-offset:2px}

/* Modal */
#modalBg{position:fixed;inset:0;background:rgba(10,30,50,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
#modalBg.on{display:flex}
.modal{background:var(--panel);border-radius:22px;width:min(900px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;background:var(--blue);color:#fff}
.mhead h2{margin:0;font-size:22px;flex:1;line-height:1.1}
.mhead .x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);font:800 22px var(--fb);color:#fff}
.mbody{padding:14px 16px 16px;overflow:auto;flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 14px;border-radius:12px;background:var(--soft);font-weight:800;min-height:38px}
.tab.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--soft);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative;border:2px solid transparent}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--blue)}
.card.sel{border-color:var(--green);background:#e6f8e6}
.card.lock{opacity:.6}
.card .art{width:100%;aspect-ratio:12/10;display:grid;place-items:center}
.card .art svg{width:100%;height:100%}
.card h3{margin:0;font-size:16px;line-height:1.1}
.card small{color:#4f6a82;font-weight:700}
.price{display:inline-flex;align-items:center;gap:4px;font:800 15px var(--fb);white-space:nowrap}
.price svg{width:18px;height:18px}
.rar{font:800 11px Nunito,sans-serif;color:#fff;padding:1px 8px;border-radius:8px}
.els{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.el{display:inline-flex;align-items:center;gap:3px;font:800 12px Nunito,sans-serif;padding:1px 7px 1px 2px;border-radius:10px;color:#fff;white-space:nowrap}
.el svg{width:16px;height:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px}
.bigart{background:radial-gradient(circle at 50% 60%,#fff,#dff1fb);border-radius:18px;aspect-ratio:12/10;display:grid;place-items:center}
.bigart svg{width:92%;height:92%}
.stat{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-weight:700}
.stat b{font-family:var(--fb)}
.bar{height:14px;border-radius:8px;background:#dbe7ef;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7fd957,#36b24a);transition:width .3s}
.bar.gold i{background:linear-gradient(90deg,#ffd75e,#ffae00)}
.pips{display:flex;gap:4px}.pips i{width:14px;height:14px;border-radius:50%;background:#d3dfe8}.pips i.on{background:var(--gold)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:16px;padding:8px 10px;flex-wrap:wrap}
.item .art{width:86px;height:72px;flex:none}
.item .art svg{width:100%;height:100%}
.item .grow{flex:1;min-width:140px}
.item h3{margin:0;font-size:17px}
.muted{color:#5b7590;font-weight:700;font-size:13px}
.note{background:#fff6dc;border-radius:12px;padding:8px 12px;font-weight:700;color:#7a5200}
.empty{text-align:center;padding:24px;color:#5b7590;font-weight:800}
.timer{font:800 15px var(--fb);white-space:nowrap}

/* Battle */
.modal.battle{width:min(1100px,98vw);height:min(640px,96vh);max-height:none}
.arena{position:relative;flex:1;background:linear-gradient(180deg,#86d3ff,#d9f3ff 55%,#9ad26a 55%,#6fb446);overflow:hidden}
.fighter{position:absolute;bottom:14%;width:34%;max-width:330px;aspect-ratio:12/10;transition:transform .2s}
.fighter svg{width:100%;height:100%}
.fighter.me{left:6%}.fighter.foe{right:6%}
.fighter.lunge.me{transform:translateX(18%)}.fighter.lunge.foe{transform:translateX(-18%)}
.fighter.hit{animation:shake .35s}
.fighter.ko{opacity:0;transform:translateY(30px);transition:all .5s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hpbox{position:absolute;top:10px;width:min(330px,42%);background:rgba(255,255,255,.92);border-radius:14px;padding:6px 10px}
.hpbox.me{left:10px}.hpbox.foe{right:10px}
.hpbox h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:6px}
.hpbox .bar{height:12px;margin-top:4px}
.hpbox .bar i.low{background:linear-gradient(90deg,#ff8a5b,#e5484d)}
.team{display:flex;gap:4px;margin-top:4px}.team i{width:12px;height:12px;border-radius:50%;background:var(--green)}.team i.dead{background:#c4ced6}
.dmg{position:absolute;font:800 30px var(--fb);color:#fff;-webkit-text-stroke:2px #8a1f1f;animation:dmg 1s ease-out forwards;pointer-events:none}
.dmg.eff{color:#ffe14a}
@keyframes dmg{to{transform:translateY(-60px);opacity:0}}
.shot{position:absolute;width:34px;height:34px;border-radius:50%;bottom:34%;transition:left .38s ease-in;box-shadow:0 0 20px currentColor}
.moves{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;background:#123049}
.mv{border-radius:14px;padding:6px 8px;color:#fff;text-align:left;min-height:54px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:center}
.mv b{font:800 15px/1.1 var(--fb)}
.mv small{font-weight:800;font-size:12px;opacity:.95}
.mv[disabled]{filter:grayscale(.8);opacity:.5;cursor:not-allowed}
.blog{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(18,48,73,.85);color:#fff;border-radius:12px;padding:6px 14px;font-weight:800;text-align:center;max-width:80%}

/* Toasts / login / rotate */
#toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:40;pointer-events:none;align-items:center}
.toast{background:#fff;border-radius:14px;padding:8px 16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .2s;display:flex;gap:8px;align-items:center;max-width:90vw}
.toast svg{width:20px;height:20px;flex:none}
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:safe center;justify-content:center;background:linear-gradient(180deg,#3fa9e6,#bfeaff);padding:12px;overflow:auto}
.lbox{background:#fff;border-radius:24px;padding:18px 22px;width:min(720px,96vw);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lbox h1{margin:0;font-size:40px;line-height:1}
.lbox p{margin:6px 0 0}
.lbox label{display:block;font-weight:800;font-size:13px;margin-top:8px}
.lbox input{width:100%;font:700 16px Nunito,sans-serif;padding:10px 12px;border-radius:12px;border:2px solid var(--line);margin-top:3px;user-select:text}
.lbox input:focus{border-color:var(--blue);outline:none}
.err{color:var(--red);font-weight:800;min-height:20px;font-size:13px;margin-top:6px}
#rotate{position:fixed;inset:0;z-index:60;background:#17324d;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
@media (orientation:portrait) and (max-width:700px){#rotate.need{display:flex}}
@media (max-height:480px){
  .mhead{padding:6px 10px 6px 14px}.mhead h2{font-size:19px}.mbody{padding:10px 12px}
  .modal{max-height:96vh}.dk .ic{width:46px;height:46px;border-radius:14px}.dk .ic svg{width:28px;height:28px}.dk{width:52px}
  .chip,.lvl{height:36px}.chip svg{width:24px;height:24px}.chip b{font-size:15px;min-width:36px}.iconbtn{width:38px;height:38px}
  .moves{padding:6px;gap:6px}.mv{min-height:44px}
  .lbox{padding:12px 16px;grid-template-columns:minmax(0,.7fr) minmax(0,1fr)}.lbox h1{font-size:30px}.lbox label{margin-top:4px}.lbox input{padding:7px 10px}
  #guide{bottom:calc(74px + env(safe-area-inset-bottom))}#guide .owl{width:64px;height:72px}#guide .say{padding:7px 11px;font-size:14px}
}
@media (max-width:640px){.split{grid-template-columns:1fr}.lbox{grid-template-columns:1fr}.lbox .logo{display:none}.xpbar{width:44px}#saveDot{display:none}.chip b{min-width:30px}}
@media (prefers-reduced-motion:reduce){.cloud,.bob,.hover,.pulse,.float,.heart,.hint{animation:none}}
</style>
</head>
<body>
<div id="app">
  <svg id="world" aria-label="Your islands. Drag to look around."><g id="cam"></g></svg>
  <div id="hud"></div>
  <div id="banner"><span id="bannerText"></span><button class="btn sm" id="bannerOk">Place</button><button class="btn sm red" id="bannerCancel">Cancel</button></div>
  <div id="guide"></div>
  <div id="leftDock"></div>
  <div id="dock"></div>
</div>
<div id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>
<div id="login"></div>
<div id="rotate"><svg width="90" height="90" viewBox="0 0 90 90"><rect x="28" y="10" width="34" height="60" rx="6" fill="none" stroke="#fff" stroke-width="5"/><path d="M14 64a32 32 0 0 0 30 18" fill="none" stroke="#ffb400" stroke-width="5" stroke-linecap="round"/><path d="M40 76l6 6-7 5" fill="none" stroke="#ffb400" stroke-width="5" stroke-linecap="round"/></svg><h2 style="margin:0;font-family:var(--fb)">Turn your phone sideways</h2><p style="margin:0">Dragon Haven plays best in landscape.</p><button class="btn" id="rotateOk">Play anyway</button></div>

<script>
{
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,a){const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return'#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1)}
const fmt = n => n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e4?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K':String(Math.floor(n));
function fmtT(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);if(s<60)return s+'s';const m=Math.floor(s/60);if(m<60)return m+'m '+(s%60)+'s';const h=Math.floor(m/60);return h+'h '+(m%60)+'m'}
const pick = (r,a) => a[Math.floor(r()*a.length)];
const inner = svg => svg.replace(/^<svg[^>]*>|<\/svg>$/g,'');

/* ================= elements ================= */
const EL={
 ember:{n:'Ember',c:'#ff5a36',c2:'#ffc23d',pre:'Cinder',suf:'flare'},
 tide:{n:'Tide',c:'#2b8cff',c2:'#8fe0ff',pre:'Brine',suf:'wave'},
 grove:{n:'Grove',c:'#3fae4a',c2:'#c3ec6e',pre:'Thorn',suf:'bloom'},
 stone:{n:'Stone',c:'#9a7550',c2:'#e3cda6',pre:'Crag',suf:'shard'},
 storm:{n:'Storm',c:'#f2b705',c2:'#4a5d8a',pre:'Thunder',suf:'bolt'},
 frost:{n:'Frost',c:'#6fcdf0',c2:'#effcff',pre:'Rime',suf:'chill'},
 shade:{n:'Shade',c:'#4b3f72',c2:'#a596e0',pre:'Gloom',suf:'shadow'},
 radiant:{n:'Radiant',c:'#ffcf33',c2:'#fff6c9',pre:'Sun',suf:'beam'},
 metal:{n:'Metal',c:'#8796a6',c2:'#dde5ec',pre:'Iron',suf:'plate'},
 wind:{n:'Wind',c:'#4fc7a3',c2:'#d8fff1',pre:'Gale',suf:'gust'},
 aether:{n:'Aether',c:'#ff6fae',c2:'#8ff0ff',pre:'Astra',suf:'nova'},
 neutral:{n:'Neutral',c:'#7d8b99',c2:'#dfe6ec'}
};
const BASE=['ember','tide','grove','stone','storm','frost','shade','radiant','metal','wind'];
// Original type chart: each element hits two others for double damage and does nothing to itself.
const STRONG={ember:['grove','frost'],tide:['ember','stone'],grove:['tide','stone'],stone:['storm','ember'],storm:['tide','wind'],frost:['grove','wind'],shade:['radiant','metal'],radiant:['shade','frost'],metal:['radiant','storm'],wind:['metal','shade'],aether:[],neutral:[]};
function mult(a,d){if(a==='neutral')return 1;if(a===d)return 0;if(a==='aether')return 1.5;if(d==='aether')return 1;if(STRONG[a].includes(d))return 2;if(STRONG[d].includes(a))return .5;return 1}
const weakTo = e => BASE.filter(x=>STRONG[x].includes(e));
function elIcon(e,size){const c=EL[e].c,s=size||16;const paths={
 ember:`<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1 1 1 2 2 2 0-2 0-4 1-6z" fill="#fff"/>`,
 tide:`<path d="M12 4c3 5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6 6-11z" fill="#fff"/>`,
 grove:`<path d="M6 18C6 9 12 5 19 5c0 8-4 13-11 13l-2 2" fill="#fff"/>`,
 stone:`<path d="M5 15l3-8h8l3 8-7 4z" fill="#fff"/>`,
 storm:`<path d="M13 3L6 13h5l-2 8 8-11h-5z" fill="#fff"/>`,

  s+=`<rect x="-2000" y="-2000" width="7000" height="6000" fill="transparent"/>`;
  [[200,250,1.4,140],[900,120,1,170],[2000,180,1.2,150],[2600,700,1.1,190],[300,1400,1.3,160],[2300,1500,1,200],[1200,1880,1.5,180],[2700,1800,.9,170]].forEach(([x,y,sc,dur],i)=>{s+=`<g class="cloud" style="animation-duration:${dur}s;animation-delay:-${i*23}s" pointer-events="none"><g transform="translate(${x-1500} ${y}) scale(${sc})" opacity=".8"><ellipse cx="0" cy="0" rx="70" ry="22" fill="#fff"/><ellipse cx="-26" cy="-14" rx="32" ry="22" fill="#fff"/><ellipse cx="22" cy="-20" rx="38" ry="28" fill="#fff"/></g></g>`});
  [[180,560],[2860,1300],[900,1900],[2100,300]].forEach(([x,y],i)=>{s+=`<g class="float" style="animation-delay:-${i*1.3}s" pointer-events="none"><path d="M${x-30} ${y}l60-6 10 12-36 40z" fill="url(#rock)"/><path d="M${x-30} ${y}l60-6 10 12-70 0z" fill="#6cc24a"/></g>`});
  s+=ISLANDS.map((I,i)=>underside(I.cx,I.cy+24,400,222,i)).join('');
  const H=ISLANDS[0];
  s+=bridge(H.cx-400,H.cy,ISLANDS[1].cx+400,ISLANDS[1].cy)+bridge(H.cx+400,H.cy,ISLANDS[2].cx-400,ISLANDS[2].cy)+bridge(H.cx,H.cy-222,ISLANDS[3].cx,ISLANDS[3].cy+232)+bridge(H.cx,H.cy+240,ISLANDS[4].cx,ISLANDS[4].cy-222);
  s+=ISLANDS.map((I,i)=>islandTop(i)+grassBits(i)).join('');
  s+=arenaIsland();
  ISLANDS.forEach((I,i)=>{for(let p=0;p<4;p++)if(!S.land[i][p])s+=lockedPlot(i,p);if(i>0)s+=islandSign(i)});
  const blds=[...S.tiles].sort((a,b)=>tileXY(a).y-tileXY(b).y).map(buildingSVG).join('');
  s+=`<g id="blds">${blds}</g>`;
  s+=`<g id="bubbles">${bubbleLayer()}</g>`;
  camEl.innerHTML=s;applyCam()}
function bubbleLayer(){let s='';
  for(const t of S.tiles){const{x:cx,y:by,s:sc}=tileXY(t);const cy=by-(t.type==='deco'?70:84)*sc;let icon='',act='',prog=null,vb='0 0 32 32';
    if(t.type==='habitat'){if(goldOf(t)>=10){icon=IC.gold;act='collect'}}
    else if(t.type==='farm'&&t.crop){if(t.end<=now()){icon=IC.food;act='harvest'}else{const c=CROPS.find(c=>c.id===t.crop);prog=1-(t.end-now())/c.t}}
    else if(t.type==='hatchery'&&S.eggs.some(e=>e.end<=now())){icon=eggSVG(S.eggs.find(e=>e.end<=now()).did);vb='0 0 110 100';act='open'}
    else if(t.type==='tree'&&S.breed){if(S.breed.end<=now()){icon=eggSVG(S.breed.did);vb='0 0 110 100';act='open'}else prog=1-(S.breed.end-now())/S.breed.dur}
    if(icon){const full=t.type==='habitat'&&goldOf(t)>=habGoldCap(t);
      s+=`<g transform="translate(${cx} ${cy})"><g class="bld pulse" data-tid="${t.id}" data-act="${act}"><path d="M0 20l-7-9h14z" fill="#fff"/><circle r="17" fill="#fff" stroke="${full?'#e5484d':'#17324d'}" stroke-width="3"/><svg x="-12" y="-12" width="24" height="24" viewBox="${vb}">${inner(icon)}</svg></g></g>`}
    else if(prog!==null){const a=Math.max(0,Math.min(1,prog))*Math.PI*2,x=Math.sin(a)*13,y=-Math.cos(a)*13;
      s+=`<g transform="translate(${cx} ${cy+8})" pointer-events="none"><circle r="16" fill="#17324d" opacity=".78"/><path d="M0 0L0-13A13 13 0 ${a>Math.PI?1:0} 1 ${x.toFixed(1)} ${y.toFixed(1)}Z" fill="#9cf06b"/><circle r="5" fill="#17324d"/></g>`}}
  if(mode)s+=gridLayer();
  return s}
function renderBubbles(){const b=$('#bubbles');if(b)b.innerHTML=bubbleLayer()}

/* ================= pointer: drag / pinch / wheel / tap ================= */
const ptrs=new Map();let drag=null,pinch=null,moved=false,downTarget=null,downBtn=0;
svgEl.addEventListener('pointerdown',e=>{svgEl.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};moved=false;downTarget=e.target;downBtn=e.button}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z,w:toWorld((a.x+b.x)/2,(a.y+b.y)/2)};moved=true}});
svgEl.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);cam.z=pinch.z*d/pinch.d;clampCam();const m=toWorld((a.x+b.x)/2,(a.y+b.y)/2);cam.x+=pinch.w.x-m.x;cam.y+=pinch.w.y-m.y;applyCam();return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&Math.hypot(dx,dy)>7){moved=true;svgEl.classList.add('dragging')}if(moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;applyCam()}}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){svgEl.classList.remove('dragging');if(!moved&&downBtn!==2&&e.type==='pointerup')tap(downTarget,e);drag=null}
  else if(ptrs.size===1){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,cx:cam.x,cy:cam.y}}}
svgEl.addEventListener('pointerup',endPtr);svgEl.addEventListener('pointercancel',endPtr);
svgEl.addEventListener('contextmenu',e=>e.preventDefault());
svgEl.addEventListener('wheel',e=>{e.preventDefault();const w=toWorld(e.clientX,e.clientY);cam.z*=Math.exp(-e.deltaY*.0015);clampCam();const m=toWorld(e.clientX,e.clientY);cam.x+=w.x-m.x;cam.y+=w.y-m.y;applyCam()},{passive:false});
function cellAt(wx,wy){for(let i=0;i<ISLANDS.length;i++){const x=Math.floor((wx-isoX(i))/CW),y=Math.floor((wy-isoY(i))/CH);if(x>=0&&y>=0&&x<IC_&&y<IR)return{is:i,x,y}}return null}
function tap(target,e){
  if(mode){const w=toWorld(e.clientX,e.clientY),c=cellAt(w.x,w.y);if(!c)return;
    mode.ghost={is:c.is,x:Math.max(0,Math.min(IC_-mode.w,c.x-Math.floor((mode.w-1)/2))),y:Math.max(0,Math.min(IR-mode.h,c.y-Math.floor((mode.h-1)/2)))};updateBanner();renderBubbles();return}
  const el=target&&target.closest?target:null;if(!el)return;
  const act=el.closest('[data-act]');if(act&&A[act.dataset.act]){A[act.dataset.act](act);return}
  const b=el.closest('.bld');if(b)return openTile(tileById(+b.dataset.tid));
  const pl=el.closest('[data-plot]');if(pl){const[i,p]=pl.dataset.plot.split(':').map(Number);return show(landPanel,i,p)}
  if(el.closest('[data-arena]'))return show(arenaPanel);
}

  const rr=t<4?['C']:t<8?['C','R']:t<13?['R','E']:t<18?['E','E','L']:['E','L'];

  let b=`<div class="note" style="margin-bottom:10px">Enemy: ${foes.map(f=>`${esc(DR(f.did).name)} Lv ${f.lvl} ${DR(f.did).els.map(e=>elIcon(e,16)).join('')}`).join(' · ')}</div><div class="muted" style="margin-bottom:6px">Pick up to 3 dragons (in order).</div>`;

  b+=`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn grey" data-open="arena">Back</button><button class="btn red" data-act="startbattle" data-t="${t}" ${teamSel.length?'':'disabled'}>Battle!</button></div>`;
  openModal(`Arena tier ${t}`,b,{color:'#e5484d'})}
let battle=null;
const mkF=(did,lvl)=>{const D=DR(did);return{did,lvl,max:hpOf(D,lvl),hp:hpOf(D,lvl),atk:atkOf(D,lvl)}};
function startBattle(t){battle={t,me:teamSel.map(u=>{const d=S.dragons.find(x=>x.uid===u);return mkF(d.did,d.lvl)}),foe:enemyTeam(t).map(e=>mkF(e.did,e.lvl)),mi:0,fi:0,busy:false,log:'Choose an attack!'};view=null;renderBattle()}
function effTag(m){if(m===0)return'No effect';if(m>=1.5)return'Strong';if(m<1)return'Weak';return''}
function renderBattle(){const B=battle,me=B.me[B.mi],fo=B.foe[B.fi],MD=DR(me.did),FD=DR(fo.did);
  const box=(f,D,team,side)=>`<div class="hpbox ${side}"><h3><span>${esc(D.name)}</span><span class="muted">Lv ${f.lvl}</span></h3><div class="els" style="justify-content:flex-start">${D.els.map(e=>elIcon(e,16)).join('')}</div><div class="bar"><i class="${f.hp/f.max<.3?'low':''}" style="width:${f.hp/f.max*100}%"></i></div><div class="row" style="justify-content:space-between"><span class="team">${team.map(x=>`<i class="${x.hp<=0?'dead':''}"></i>`).join('')}</span><span class="muted">${Math.max(0,Math.ceil(f.hp))} / ${f.max}</span></div></div>`;
  const mv=movesOf(MD).map((m,i)=>{const lock=me.lvl<m.u,mu=mult(m.el,FD.els[0]),tag=effTag(mu);return`<button class="mv" style="background:${shade(EL[m.el].c,-.15)}" data-act="atk" data-i="${i}" ${lock||B.busy?'disabled':''}><b>${m.n}</b><small>${lock?`Unlocks Lv ${m.u}`:`Power ${m.p}${tag?' · '+tag:''}`}</small></button>`}).join('');
  openModal('',`<div class="mhead" style="background:#e5484d"><h2>Arena tier ${B.t}</h2><button class="x" data-act="flee" aria-label="Leave battle">×</button></div><div class="arena" id="arenaBox">${box(me,MD,B.me,'me')}${box(fo,FD,B.foe,'foe')}<div class="fighter me" id="fMe">${dragonSVG(me.did,stageOf(me.lvl))}</div><div class="fighter foe" id="fFoe">${dragonSVG(fo.did,stageOf(fo.lvl),{flip:true})}</div><div class="blog" id="blog">${esc(B.log)}</div></div><div class="moves">${mv}</div>`,{raw:true,cls:'battle'})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function doAttack(fromMe,m){const B=battle;if(!B)return;const a=fromMe?B.me[B.mi]:B.foe[B.fi],d=fromMe?B.foe[B.fi]:B.me[B.mi];
  const mu=mult(m.el,DR(d.did).els[0]),dmg=Math.round(m.p*a.atk/10*mu*(.9+Math.random()*.2));
  const box=$('#arenaBox');if(!box)return;const fa=$(fromMe?'#fMe':'#fFoe'),fd=$(fromMe?'#fFoe':'#fMe');
  $('#blog').textContent=`${DR(a.did).name} used ${m.n}!`;fa.classList.add('lunge');
  const shot=document.createElement('div');shot.className='shot';shot.style.background=EL[m.el].c;shot.style.color=EL[m.el].c;shot.style.left=fromMe?'30%':'64%';box.appendChild(shot);
  await wait(30);shot.style.left=fromMe?'70%':'26%';await wait(400);shot.remove();fa.classList.remove('lunge');
  d.hp=Math.max(0,d.hp-dmg);fd.classList.add('hit');
  const n=document.createElement('div');n.className='dmg'+(mu>=1.5?' eff':'');n.textContent=mu===0?'No effect':'-'+dmg;n.style.left=fromMe?'72%':'18%';n.style.top='38%';box.appendChild(n);setTimeout(()=>n.remove(),1000);
  const tag=effTag(mu);if(tag)$('#blog').textContent=tag==='Strong'?"It's super strong!":tag==='Weak'?'Not very strong…':'It had no effect!';
  const hb=box.querySelector(fromMe?'.hpbox.foe .bar i':'.hpbox.me .bar i');if(hb){hb.style.width=(d.hp/d.max*100)+'%';hb.classList.toggle('low',d.hp/d.max<.3)}
  await wait(500);fd.classList.remove('hit');
  if(d.hp<=0){fd.classList.add('ko');$('#blog').textContent=`${DR(d.did).name} fainted!`;await wait(700);return true}return false}
async function playerMove(i){const B=battle;if(!B||B.busy)return;B.busy=true;document.querySelectorAll('.mv').forEach(b=>b.disabled=true);
  const m=movesOf(DR(B.me[B.mi].did))[i];
  if(await doAttack(true,m)){B.fi++;if(B.fi>=B.foe.length)return endBattle(true);B.log='A new foe appears!';B.busy=false;renderBattle();return}
  if(!battle)return;await wait(250);
  const fo=B.foe[B.fi],me=B.me[B.mi],opts=movesOf(DR(fo.did)).filter(m=>fo.lvl>=m.u);
  const best=opts.map(m=>({m,s:m.p*mult(m.el,DR(me.did).els[0])*(.8+Math.random()*.4)})).sort((a,b)=>b.s-a.s)[0].m;
  if(await doAttack(false,best)){B.mi++;if(B.mi>=B.me.length)return endBattle(false);B.log='Go, '+DR(B.me[B.mi].did).name+'!'}
  else B.log='Your turn!';
  if(battle){B.busy=false;renderBattle()}}
function endBattle(win){const t=battle.t;let msg='',extra='';
  if(win){const g=80*t+50,x=15*t;S.gold+=g;S.stats.wins++;addXP(x);msg=`${price('gold',g)} ${price('xp',x)}`;
    if(t>S.arena.cleared){S.arena.cleared=t;S.gems+=3;msg+=` ${price('gem',3)}`;
      if(t%5===0){const R=['R','E','E','L'][t/5-1],pool=DRAGONS.filter(d=>d.id<RELEASED&&d.r===R),did=pool[Math.floor(Math.random()*pool.length)].id;
        if(S.eggs.length<S.hatchCap){S.eggs.push({uid:S.uid++,did,end:now()+RAR[R].ht*60e3});extra=`<p class="note">A ${RAR[R].n} egg was sent to your Hatchery!</p>`}else{S.gems+=20;extra='<p class="note">Your Hatchery was full, so you got 20 gems instead of an egg.</p>'}}}}
  else{addXP(5);msg=price('xp',5)}
  battle=null;commit();
  openModal(win?'Victory!':'Defeat',`<div style="text-align:center"><h2 style="font-size:34px;margin:4px 0">${win?'You won!':'Your team fainted'}</h2><div class="row" style="justify-content:center">${msg}</div>${extra}${win?'':'<p class="muted">Feed your dragons to raise their level, and pick elements that are strong against the enemy.</p>'}<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-open="arena">Back to Arena</button></div></div>`,{color:win?'#36b24a':'#5d6d7e'})}

function settingsPanel(){openModal('Settings',`<div class="stat"><span>Player</span><b>${session.user?esc(session.user):'Guest (this device only)'}</b></div><div class="stat"><span>Save</span><b>${esc(saveState||'Saved on this device')}</b></div><div class="stat"><span>Dragons released</span><b>${RELEASED} of 400</b></div><div class="stat"><span>Moving the map</span><b>Drag, right-drag, pinch or scroll</b></div>
  <div class="row" style="margin-top:14px">${session.token?'<button class="btn blue" data-act="savenow">Save now</button>':''}${S.tut<TUT.length?'<button class="btn grey" data-act="skiptut">Skip tutorial</button>':''}<button class="btn grey" data-act="logout">${session.user?'Log out':'Back to title'}</button><button class="btn red" data-act="reset">${resetArm?'Tap again to erase everything':'Start over'}</button></div>`,{color:'#17324d'})}

/* ================= tutorial (original guide: Pip the owl) ================= */
const TUT=[
 {t:"Hoo there! I'm Pip, keeper of these sky islands. Let's get your Haven started. Every dragon needs a home, so first we'll build a habitat.",next:1},
 {t:'Open the Shop and buy an Ember Habitat. Then tap a spot on your island to place it.',hint:'shop',hintIn:'[data-item="habitat:ember"]',done:s=>s.tiles.some(t=>t.type==='habitat')},
 {t:"Lovely! Now let's get a dragon to live there. In the Shop's Eggs tab, buy an Emberkin egg.",hint:'shop',hintIn:'[data-did="0"],[data-tab="eggs"]',done:s=>s.eggs.length>0||s.dragons.length>0},
 {t:'Your egg went to the Hatchery. Tap the Hatchery on your island. When the timer ends, hatch it into your Ember Habitat.',hintIn:'[data-act="hatch"],[data-act="hatchTo"]',done:s=>s.dragons.length>0},
 {t:'Your first dragon! Dragons grow by eating, so you need food. Buy a Farm in the Shop and place it.',hint:'shop',hintIn:'[data-item="farm"],[data-tab="farms"]',done:s=>s.tiles.some(t=>t.type==='farm')},
 {t:'Tap your new Farm and plant some Dragonberries. They grow in 30 seconds.',hintIn:'[data-crop="berry"]',done:s=>s.tiles.some(t=>t.type==='farm'&&t.crop)||s.stats.harvests>0},
 {t:'When the berries are ripe, tap the bubble over the Farm to harvest them.',done:s=>s.stats.harvests>0},
 {t:'Now tap your Ember Habitat and feed your dragon. Four meals and it levels up, and at level 4 it can breed!',hintIn:'[data-act="feed"]',done:s=>s.stats.feeds>0},
 {t:"Splendid! The Haven is yours now. Collect gold from habitats, buy land to grow, breed new dragons at the Breeding Tree, and fill your Book. Drag the map to explore the other islands!",next:1,last:1}];
function tutRender(){const g=$('#guide');document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));
  if(!S||S.tut>=TUT.length){g.classList.remove('on');return}
  const st=TUT[S.tut],open=$('#modalBg').classList.contains('on');
  g.classList.add('on');
  g.innerHTML=OWL+`<div class="say"><b>Pip</b>${esc(st.t)}${st.next?`<div class="row"><button class="btn sm" data-act="tutnext">${st.last?"Let's go!":'Okay!'}</button></div>`:''}</div>`;
  if(!open&&st.hint){const d=document.querySelector(`[data-dk="${st.hint}"]`);if(d)d.classList.add('hint')}
  if(open&&st.hintIn){const el=document.querySelector('#modal '+st.hintIn.split(',').join(',#modal '));if(el)el.classList.add('hint')}}
function tutCheck(){if(!S||S.tut>=TUT.length)return;let ch=false;while(S.tut<TUT.length&&TUT[S.tut].done&&TUT[S.tut].done(S)){S.tut++;ch=true}if(ch){saveLocal();tutRender()}}

/* ================= actions ================= */
function startPlace(item){const[type]=item.split(':');const[w,h]=FP[type];const spot=findSpot(w,h);
  if(!spot){closeModal();return toast('No free space. Buy more land to build!')}
  mode={kind:'place',item,w,h,ghost:spot};closeModal();updateBanner();renderWorld();focusGhost()}
function startMove(tid){const t=tileById(tid),[w,h]=fpOf(t);mode={kind:'move',tid,w,h,ghost:{is:t.is,x:t.x,y:t.y}};closeModal();updateBanner();renderWorld();focusGhost()}
function focusGhost(){const g=mode.ghost,x=isoX(g.is)+(g.x+mode.w/2)*CW,y=isoY(g.is)+(g.y+mode.h/2)*CH;panTo(x,y)}
function updateBanner(){const ok=mode&&mode.ghost&&canPlace(mode.ghost.is,mode.ghost.x,mode.ghost.y,mode.w,mode.h,mode.tid);
  $('#bannerText').textContent=ok?'Tap the map to choose a spot':"Can't build there. Pick a green spot";$('#bannerOk').disabled=!ok;$('#bannerOk').textContent=mode&&mode.kind==='move'?'Move here':'Place';$('#banner').classList.add('on')}
function endMode(){mode=null;$('#banner').classList.remove('on');renderWorld()}
function confirmPlace(){if(!mode||!mode.ghost)return;const g=mode.ghost;if(!canPlace(g.is,g.x,g.y,mode.w,mode.h,mode.tid))return;
  if(mode.kind==='move'){const t=tileById(mode.tid);t.is=g.is;t.x=g.x;t.y=g.y;endMode();commit();return}
  const[type,arg]=mode.item.split(':');
  if(type==='habitat'){const c=habCost(arg);if(!spend(c.cur,c.v))return endMode();S.tiles.push({id:S.uid++,type:'habitat',el:arg,lvl:1,is:g.is,x:g.x,y:g.y,gold:0,t:now()});addXP(30);toast(`${EL[arg].n} Habitat built!`)}
  if(type==='farm'){const c=farmCost();if(!spend('gold',c))return endMode();S.tiles.push({id:S.uid++,type:'farm',is:g.is,x:g.x,y:g.y,crop:null,end:0});addXP(15);toast('Farm built!')}
  if(type==='deco'){const dc=DECOS.find(d=>d.id===arg);if(!spend(dc.cur,dc.cost))return endMode();S.tiles.push({id:S.uid++,type:'deco',kind:arg,is:g.is,x:g.x,y:g.y});addXP(dc.xp)}
  endMode();commit()}
function collect(t){const g=Math.floor(goldOf(t));if(g<1)return 0;S.gold+=g;t.gold=goldOf(t)-g;t.t=now();S.stats.collects++;return g}
const A={
 collect(e){const t=tileById(+e.dataset.tid),g=collect(t);if(g){toast(`+${fmt(g)} gold`,'gold');commit();refresh()}},
 harvest(e){const t=tileById(+e.dataset.tid),c=CROPS.find(c=>c.id===t.crop);if(!c)return;S.food+=c.food;S.stats.harvests++;addXP(Math.max(2,Math.round(c.food/20)));t.crop=null;t.end=0;toast(`+${c.food} food`,'food');commit();refresh()},
 open(e){openTile(tileById(+e.dataset.tid))},
 feed(e){const d=S.dragons.find(x=>x.uid===+e.dataset.uid),D=DR(d.did),c=feedCost(D,d.lvl);if(d.lvl>=MAXLV)return;if(!spend('food',c))return;
   const hab=tileById(d.hab);if(hab)bank(hab);d.feeds++;S.stats.feeds++;addXP(Math.max(1,Math.round(c/5)));
   if(d.feeds>=4){const old=stageOf(d.lvl);d.feeds=0;d.lvl++;toast(`${D.name} reached level ${d.lvl}!`,'xp');if(stageOf(d.lvl)>old)toast(`${D.name} grew into a${stageOf(d.lvl)===2?'n Adult':' Young dragon'}!`)}
   commit();refresh()},
 dinfo(e){show(dragonInfo,+e.dataset.uid)},
 rehome(e){show(rehomePanel,+e.dataset.uid)},
 rehomeTo(e){const d=S.dragons.find(x=>x.uid===+e.dataset.uid),from=tileById(d.hab),to=tileById(+e.dataset.tid);if(from)bank(from);bank(to);d.hab=to.id;commit();show(habitatPanel,to.id)},
 selld(e){const d=S.dragons.find(x=>x.uid===+e.dataset.uid);if(S.dragons.length<=1)return toast('You need to keep at least one dragon');const v=RAR[DR(d.did).r].sell*d.lvl;const h=tileById(d.hab);if(h)bank(h);S.dragons=S.dragons.filter(x=>x!==d);S.gold+=v;toast(`Sold for ${fmt(v)} gold`,'gold');commit();h?show(habitatPanel,h.id):closeModal()},
 habup(e){const t=tileById(+e.dataset.tid),c=1500*t.lvl*t.lvl;if(!spend('gold',c))return;bank(t);t.lvl++;addXP(40);toast('Habitat upgraded!');commit();refresh()},
 move(e){startMove(+e.dataset.tid)},
 sellb(e){const t=tileById(+e.dataset.tid);const v=t.type==='habitat'?Math.round((HAB_COST[t.el]||1000)*.3):t.type==='farm'?100:30;S.tiles=S.tiles.filter(x=>x!==t);S.gold+=v;toast(`Sold for ${v} gold`,'gold');closeModal();commit()},
 plant(e){const t=tileById(+e.dataset.tid),c=CROPS.find(c=>c.id===e.dataset.crop);if(!spend('gold',c.cost))return;t.crop=c.id;t.end=now()+c.t;commit();closeModal()},
 rushfarm(e){const t=tileById(+e.dataset.tid),gc=Math.max(1,Math.ceil((t.end-now())/120000));if(!spend('gems',gc))return;t.end=now();commit();refresh()},
 hatch(e){show(hatchPick,+e.dataset.uid)},
 hatchTo(e){const egg=S.eggs.find(x=>x.uid===+e.dataset.uid),t=tileById(+e.dataset.tid);bank(t);S.eggs=S.eggs.filter(x=>x!==egg);
   S.dragons.push({uid:S.uid++,did:egg.did,lvl:1,feeds:0,hab:t.id});S.stats.hatches++;addXP(RAR[DR(egg.did).r].xp);discover(egg.did);commit();
   openModal('It hatched!',`<div style="text-align:center"><div class="bigart" style="max-width:320px;margin:0 auto">${dragonSVG(egg.did,0)}</div><h2 style="margin:8px 0 4px">${esc(DR(egg.did).name)}</h2><div class="els">${DR(egg.did).els.map(elChip).join('')} ${rarBadge(DR(egg.did).r)}</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-close>Yay!</button><button class="btn blue" data-open="hatchery">Hatchery</button></div></div>`,{color:RAR[DR(egg.did).r].col})},
 rushegg(e){const egg=S.eggs.find(x=>x.uid===+e.dataset.uid),gc=Math.max(1,Math.ceil((egg.end-now())/120000));if(!spend('gems',gc))return;egg.end=now();commit();refresh()},
 sellegg(e){const egg=S.eggs.find(x=>x.uid===+e.dataset.uid);const v=Math.round(RAR[DR(egg.did).r].sell/2);S.eggs=S.eggs.filter(x=>x!==egg);S.gold+=v;toast(`Egg sold for ${v} gold`,'gold');commit();refresh()},
 hatchup(){const c=2000*(S.hatchCap-2);if(!spend('gold',c))return;S.hatchCap++;commit();refresh()},
 bsel(e){const u=+e.dataset.uid,i=breedSel.indexOf(u);if(i>=0)breedSel.splice(i,1);else{if(breedSel.length>=2)breedSel.shift();breedSel.push(u)}refresh()},
 breed(){const[a,b]=breedSel.map(u=>S.dragons.find(d=>d.uid===u));if(!a||!b)return;const kids=possibleChildren(a.did,b.did);
   const tot=kids.reduce((s,k)=>s+RAR[k.r].w,0);let r=Math.random()*tot,res=kids[0];for(const k of kids){r-=RAR[k.r].w;if(r<=0){res=k;break}}
   const dur=RAR[res.r].bt*60e3;S.breed={did:res.id,end:now()+dur,dur};S.stats.breeds++;addXP(10);breedSel=[];commit();refresh()},
 rushbreed(){const gc=Math.max(1,Math.ceil((S.breed.end-now())/120000));if(!spend('gems',gc))return;S.breed.end=now();commit();refresh()},
 takeegg(){if(S.eggs.length>=S.hatchCap)return toast('Your Hatchery is full. Hatch or sell an egg first.');const r=DR(S.breed.did).r;S.eggs.push({uid:S.uid++,did:S.breed.did,end:now()+RAR[r].ht*60e3});S.breed=null;toast('Egg sent to the Hatchery');commit();show(hatcheryPanel)},
 buy(e){startPlace(e.dataset.item)},
 buyegg(e){const i=+e.dataset.did;if(S.eggs.length>=S.hatchCap)return toast('Your Hatchery is full');if(!spend('gold',eggCost(i)))return;const first=!S.stats.hatches&&!S.eggs.length;S.eggs.push({uid:S.uid++,did:i,end:now()+(first?10e3:RAR.C.ht*60e3)});toast('Egg sent to the Hatchery');commit();closeModal()},
 buyland(e){const i=+e.dataset.i,p=+e.dataset.p,I=ISLANDS[i];if(S.level<I.lv||S.land[i][p])return;if(!spend('gold',I.plots[p]))return;S.land[i][p]=1;addXP(50);toast('New land cleared!');closeModal();commit()},
 buyisland(e){const i=+e.dataset.i,I=ISLANDS[i];if(S.level<I.lv)return;if(!spend('gold',wholePrice(i)))return;S.land[i]=[1,1,1,1];addXP(150);toast(`${I.name} is all yours!`);closeModal();commit()},
 dsort(e){dragonsSort=e.dataset.s;refresh()},
 btab(e){bookTab=e.dataset.t;refresh()},
 binfo(e){show(bookInfo,+e.dataset.did)},
 claim(e){const g=GOALS.find(x=>x.id===e.dataset.g);if(S.goals[g.id]||!g.p(S))return;S.goals[g.id]=1;for(const k in g.r)S[k]+=g.r[k];toast('Reward claimed!','gem');commit();refresh()},
 pickteam(e){teamSel=[];show(teamPanel,+e.dataset.t)},
 tsel(e){const u=+e.dataset.uid,i=teamSel.indexOf(u);if(i>=0)teamSel.splice(i,1);else if(teamSel.length<3)teamSel.push(u);refresh()},
 startbattle(e){if(teamSel.length)startBattle(+e.dataset.t)},
 atk(e){playerMove(+e.dataset.i)},
 flee(){battle=null;show(arenaPanel)},
 tutnext(){S.tut++;saveLocal();tutCheck();tutRender()},
 skiptut(){S.tut=TUT.length;saveLocal();closeModal()},
 savenow(){saveCloud(true);toast('Saving…')},
 logout(){saveLocal();if(session.token)saveCloud(false,true);session.user=session.token=null;try{localStorage.removeItem('dh_session')}catch(e){}closeModal();S=null;$('#guide').classList.remove('on');showLogin()},
 reset(){if(!resetArm){resetArm=true;return refresh()}resetArm=false;S=fresh();S.savedAt=now();saveLocal();if(session.token)saveCloud(true);closeModal();renderAll();homeCam();toast('A fresh island!')}
};
const OPEN={shop:t=>show(shopPanel,t),dragons:()=>show(dragonsPanel),book:()=>show(bookPanel),arena:()=>show(arenaPanel),goals:()=>show(goalsPanel),settings:()=>{resetArm=false;show(settingsPanel)},farms:()=>show(farmsOverview),hatchery:()=>show(hatcheryPanel),home:()=>{const z=cam.z;homeCam();},
 collectAll:()=>{let g=0;S.tiles.filter(t=>t.type==='habitat').forEach(t=>g+=collect(t));let f=0;S.tiles.filter(t=>t.type==='farm'&&t.crop&&t.end<=now()).forEach(t=>{const c=CROPS.find(c=>c.id===t.crop);f+=c.food;S.food+=c.food;S.stats.harvests++;t.crop=null});if(g||f){toast(`Collected ${g?fmt(g)+' gold':''}${g&&f?' and ':''}${f?f+' food':''}`,'gold');commit()}else toast('Nothing to collect yet')}};
function openTile(t){if(!t)return;
  if(t.type==='habitat')show(habitatPanel,t.id);else if(t.type==='farm')show(farmPanel,t.id);else if(t.type==='hatchery')show(hatcheryPanel);else if(t.type==='tree'){breedSel=[];show(breedPanel)}
  else if(t.type==='deco')openModal(DECOS.find(d=>d.id===t.kind).n,`<div class="row" style="justify-content:center"><button class="btn grey" data-act="move" data-tid="${t.id}">Move</button><button class="btn red" data-act="sellb" data-tid="${t.id}">Sell</button></div>`,{color:'#3fae4a'})}

/* ================= events ================= */
document.addEventListener('click',e=>{
  if(e.target.closest('#world'))return;
  if(e.target.closest('[data-close]')||e.target.id==='modalBg'){if(!battle)closeModal();return}
  const o=e.target.closest('[data-open]');if(o){const[k,a]=o.dataset.open.split(':');if(OPEN[k])OPEN[k](a);return}
  const oh=e.target.closest('[data-open-hab]');if(oh)return show(habitatPanel,+oh.dataset.openHab);
  const of=e.target.closest('[data-open-farm]');if(of)return show(farmPanel,+of.dataset.openFarm);
  const a=e.target.closest('[data-act]');if(a&&!a.disabled&&A[a.dataset.act]){A[a.dataset.act](a);return}
});
$('#bannerCancel').onclick=endMode;$('#bannerOk').onclick=confirmPlace;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(mode)endMode();else if(!battle)closeModal()}if(e.key==='Enter'&&mode)confirmPlace()});
$('#rotateOk').onclick=()=>$('#rotate').classList.remove('need');
addEventListener('resize',()=>{if(S)resize()});

/* ================= tick ================= */
let lastSig='';
function readySig(){return S.tiles.filter(t=>t.type==='farm').map(t=>t.crop&&t.end<=now()?1:0).join('')+'|'+S.eggs.map(e=>e.end<=now()?1:0).join('')+'|'+(S.breed&&S.breed.end<=now()?1:0)}
setInterval(()=>{if(!S)return;renderBubbles();
  document.querySelectorAll('[data-end]').forEach(el=>{el.textContent=fmtT(+el.dataset.end-now())});
  document.querySelectorAll('[data-pend]').forEach(el=>{const a=+el.dataset.pstart,b=+el.dataset.pend;el.style.width=Math.min(100,(now()-a)/(b-a)*100)+'%'});
  const sig=readySig();if(sig!==lastSig){const first=!lastSig;lastSig=sig;if(!first){renderWorld();if(view&&[farmPanel,hatcheryPanel,breedPanel,farmsOverview].includes(view.fn))refresh()}}
},1000);
setInterval(()=>{if(S&&!drag&&!mode)renderWorld()},15000);
setInterval(()=>{if(S){saveLocal();if(dirty)saveCloud()}},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S){saveLocal();if(session.token)saveCloud(false,true)}});

/* ================= boot / login ================= */
function daily(){const d=new Date().toDateString();if(S.lastDaily!==d){const first=!S.lastDaily;S.lastDaily=d;if(!first){S.gems+=3;S.gold+=200;setTimeout(()=>toast('Daily gift: +200 gold and +3 gems','gem'),600)}commit()}}
function startGame(save){S=migrate(save);if(!save)S.savedAt=now();$('#login').style.display='none';
  if(matchMedia('(orientation:portrait) and (max-width:700px)').matches)$('#rotate').classList.add('need');
  lastSig='';resize();renderAll();homeCam();daily();saveLocal();if(session.token)saveCloud(true);
  const away=save&&save.savedAt?now()-save.savedAt:0;if(away>60000){const g=S.tiles.filter(t=>t.type==='habitat').reduce((s,t)=>s+Math.floor(goldOf(t)),0);if(g>0)setTimeout(()=>toast(`Welcome back! Your dragons made ${fmt(g)} gold while you were away`,'gold'),900)}}
async function showLogin(){const L=$('#login');L.style.display='flex';
  const logo=`<svg viewBox="0 0 220 180" width="100%"><ellipse cx="110" cy="150" rx="96" ry="18" fill="#5bbb3e"/><path d="M20 150C40 175 180 175 200 150C180 190 40 190 20 150Z" fill="#8a5a36"/><g transform="translate(-6 40) scale(.95)">${inner(dragonSVG(30,2))}</g><g transform="translate(96 30) scale(1)">${inner(dragonSVG(57,2,{flip:true}))}</g></svg>`;
  L.innerHTML=`<div class="lbox"><div class="logo">${logo}</div><div><h1>Dragon Haven</h1><p class="muted">Breed, hatch, raise and battle dragons across your own floating islands.</p>
  <form id="lform"><label for="lu">Player name</label><input id="lu" autocomplete="username" maxlength="20"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" maxlength="100">
  <div class="err" id="lerr"></div><div class="row"><button class="btn" type="submit" id="lin">Log in</button><button class="btn blue" type="button" id="lreg">Create account</button></div></form>
  <button class="btn grey" id="lguest" style="margin-top:8px;width:100%">Play as guest (saves on this device)</button><p class="muted" id="lnet" style="margin-top:6px"></p></div></div>`;
  const err=m=>$('#lerr').textContent=m;
  let online=false;try{await api('/api/health');online=true}catch(e){}
  session.online=online;
  if(!online){$('#lnet').textContent='Online accounts are not available here, so guest mode is on.';$('#lin').disabled=$('#lreg').disabled=true}
  const go=async reg=>{const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p)return err('Enter a name and password');
    try{const r=await api(reg?'/api/register':'/api/login',{method:'POST',body:{username:u,password:p}});session.user=r.username;session.token=r.token;try{localStorage.setItem('dh_session',JSON.stringify({u:r.username,t:r.token}))}catch(e){}
      const local=loadLocal();const save=r.save&&local?(local.savedAt>r.save.savedAt?local:r.save):(r.save||local);setSave('Saved');startGame(save)}catch(e){err(e.message)}};
  $('#lform').onsubmit=e=>{e.preventDefault();go(false)};$('#lreg').onclick=()=>go(true);
  $('#lguest').onclick=()=>{session.user=null;session.token=null;try{localStorage.setItem('dh_session',JSON.stringify({guest:1}))}catch(e){}setSave('Saved on this device');startGame(loadLocal())}}
async function boot(){let ses=null;try{ses=JSON.parse(localStorage.getItem('dh_session')||'null')}catch(e){}
  if(ses&&ses.t){session.user=ses.u;session.token=ses.t;try{const r=await api('/api/save');const local=loadLocal();const save=r.save&&local?(local.savedAt>r.save.savedAt?local:r.save):(r.save||local);setSave('Saved');return startGame(save)}catch(e){session.user=session.token=null}}
  if(ses&&ses.guest){setSave('Saved on this device');return startGame(loadLocal())}
  showLogin()}
boot();
}
</script>
